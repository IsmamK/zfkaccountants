name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zfkaccountants-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch || "${{ github.event.before }}" == 0000000000000000000000000000000000000000 ]]; then
            backend=true
            frontend=true
            infra=true
          else
            changed=$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}')
            backend=false
            frontend=false
            infra=false
            if grep -Eq '^backend/' <<< "$changed"; then backend=true; fi
            if grep -Eq '^frontend/' <<< "$changed"; then frontend=true; fi
            if grep -Eq '^(deploy/|\.github/workflows/)' <<< "$changed"; then infra=true; fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Test Django and audit dependencies
        working-directory: backend
        env:
          DEBUG: 'True'
        run: |
          python -m pip install -r requirements.txt pip-audit
          python manage.py check
          python manage.py test api
          pip-audit -r requirements.txt
      - name: Check production settings
        working-directory: backend
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-only-not-a-production-secret-replace-me
          ALLOWED_HOSTS: api.zfkaccountants.com
          CORS_ALLOWED_ORIGINS: https://zfkaccountants.com
          CSRF_TRUSTED_ORIGINS: https://zfkaccountants.com
          SESSION_COOKIE_SECURE: 'True'
          CSRF_COOKIE_SECURE: 'True'
          SECURE_PROXY_SSL_HEADER: 'True'
          SECURE_SSL_REDIRECT: 'True'
        run: python manage.py check --deploy

  backend:
    needs: [changes, backend-tests]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: abdullahibnasiddiquie/zfkaccountants-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: abdullahibnasiddiquie/zfkaccountants-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.zfkaccountants.com
            NEXT_PUBLIC_SITE_URL=https://zfkaccountants.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [changes, backend, frontend]
    if: ${{ always() && needs.changes.result == 'success' && (needs.changes.outputs.backend != 'true' || needs.backend.result == 'success') && (needs.changes.outputs.frontend != 'true' || needs.frontend.result == 'success') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/zfkaccountants_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/zfkaccountants_deploy ~/.ssh/known_hosts
      - name: Copy project deployment configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
        run: |
          set -Eeuo pipefail
          bootstrap="/tmp/zfkaccountants-bootstrap-${{ github.sha }}.sh"
          scp -O -i ~/.ssh/zfkaccountants_deploy -P "$VPS_PORT" deploy/scripts/bootstrap-vps.sh "$VPS_USER@$VPS_HOST:$bootstrap"
          ssh -i ~/.ssh/zfkaccountants_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash '$bootstrap' && rm -f '$bootstrap'"
          printf '%s' "$DOCKER_HUB_PAT" | ssh -i ~/.ssh/zfkaccountants_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'DOCKER_CONFIG="$HOME/.docker-zfkaccountants" docker login -u abdullahibnasiddiquie --password-stdin'
          scp -O -i ~/.ssh/zfkaccountants_deploy -P "$VPS_PORT" deploy/compose/docker-compose.prod.yml "$VPS_USER@$VPS_HOST:/opt/zfkaccountants/compose/docker-compose.prod.yml"
          scp -O -i ~/.ssh/zfkaccountants_deploy -P "$VPS_PORT" deploy/scripts/*.sh "$VPS_USER@$VPS_HOST:/opt/zfkaccountants/scripts/"
          scp -O -i ~/.ssh/zfkaccountants_deploy -P "$VPS_PORT" deploy/nginx/zfkaccountants.conf "$VPS_USER@$VPS_HOST:/opt/zfkaccountants/nginx/zfkaccountants.conf"
          scp -O -i ~/.ssh/zfkaccountants_deploy -P "$VPS_PORT" deploy/nginx/zfkaccountants-bootstrap.conf "$VPS_USER@$VPS_HOST:/opt/zfkaccountants/nginx/zfkaccountants-bootstrap.conf"
          scp -O -i ~/.ssh/zfkaccountants_deploy -P "$VPS_PORT" deploy/certbot/zfkaccountants-renew-hook.sh "$VPS_USER@$VPS_HOST:/opt/zfkaccountants/certbot/zfkaccountants-renew-hook.sh"
          scp -O -i ~/.ssh/zfkaccountants_deploy -P "$VPS_PORT" deploy/systemd/zfkaccountants-backup.service deploy/systemd/zfkaccountants-backup.timer "$VPS_USER@$VPS_HOST:/opt/zfkaccountants/systemd/"
          ssh -i ~/.ssh/zfkaccountants_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash /opt/zfkaccountants/scripts/init-nginx.sh'
      - name: Deploy and validate
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          BUILD_BACKEND: ${{ needs.changes.outputs.backend }}
          BUILD_FRONTEND: ${{ needs.changes.outputs.frontend }}
          BUILD_INFRA: ${{ needs.changes.outputs.infra }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          args=()
          if [[ "$BUILD_BACKEND" == true ]]; then args+=(--backend "abdullahibnasiddiquie/zfkaccountants-backend:$COMMIT_SHA"); fi
          if [[ "$BUILD_FRONTEND" == true ]]; then args+=(--frontend "abdullahibnasiddiquie/zfkaccountants-frontend:$COMMIT_SHA"); fi
          if [[ "$BUILD_INFRA" == true ]]; then args+=(--infra); fi
          ssh -i ~/.ssh/zfkaccountants_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash /opt/zfkaccountants/scripts/deploy.sh "${args[@]}"
          ssh -i ~/.ssh/zfkaccountants_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash /opt/zfkaccountants/scripts/install-backup.sh
