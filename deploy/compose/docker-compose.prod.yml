name: zfkaccountants

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../env/postgres.env
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    env_file: ../env/backend.env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ../data/media:/app/media
      - ../data/static:/app/staticfiles
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/ready/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [private]
    logging: *logging

  tracking-worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    command: ["python", "manage.py", "tracking_worker"]
    restart: unless-stopped
    env_file: ../env/backend.env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ../data/media:/app/media
    networks: [private]
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    restart: unless-stopped
    env_file: ../env/frontend.env
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:3005:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [private]
    logging: *logging

networks:
  private: {}
