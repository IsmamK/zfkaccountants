server {
    listen 80;
    listen [::]:80;
    server_name zfkaccountants.com www.zfkaccountants.com api.zfkaccountants.com;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/zfkaccountants/acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zfkaccountants.com;
    ssl_certificate /etc/letsencrypt/live/zfkaccountants.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zfkaccountants.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 301 https://zfkaccountants.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zfkaccountants.com;
    ssl_certificate /etc/letsencrypt/live/zfkaccountants.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zfkaccountants.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.zfkaccountants.com;
    ssl_certificate /etc/letsencrypt/live/zfkaccountants.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zfkaccountants.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location ~ /\. { return 404; }
    location /static/ {
        alias /opt/zfkaccountants/data/static/;
        try_files $uri =404;
    }
    location /media/ {
        alias /opt/zfkaccountants/data/media/;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
